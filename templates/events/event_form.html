{% extends "base.html" %}

{% block title %}{{ heading }} | Event Booking{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-9 col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">{{ heading }}</h1>

        <form method="post" novalidate data-prevent-double-submit>
          {% csrf_token %}
          {% include "includes/form_body.html" %}

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" data-loading-text="Saving...">{{ submit_label }}</button>
            <a class="btn btn-outline-secondary" href="{% url 'events:organizer_dashboard' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
