<div class="col">
  <div class="card h-100 shadow-sm event-card">
    <div class="card-body d-flex flex-column">
      <h2 class="h5 card-title">
        <a class="stretched-link text-decoration-none text-reset" href="{% url 'events:event_detail' event.pk %}">{{ event.title }}</a>
      </h2>
      <p class="text-muted small mb-1">{{ event.start_datetime|date:"D, d M Y, H:i" }}</p>
      <p class="text-muted small mb-1">{{ event.venue }}</p>
      <p class="small mb-3">Hosted by {{ event.organizer.get_full_name }}</p>
      <div class="mt-auto d-flex justify-content-between align-items-center">
        {% include "events/_availability_badge.html" %}
        <span class="small text-primary">View details &rarr;</span>
      </div>
    </div>
  </div>
</div>
