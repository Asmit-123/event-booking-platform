<div class="col">
  <div class="card h-100 shadow-sm event-card">
    <div class="event-banner-pattern" aria-hidden="true">
      <div class="event-date-badge">
        <span class="event-date-month">{{ event.start_datetime|date:"M" }}</span>
        <span class="event-date-day">{{ event.start_datetime|date:"d" }}</span>
      </div>
    </div>
    <div class="event-card-body">
      <h2 class="h5 card-title event-card-title">
        <a class="stretched-link text-decoration-none text-reset" href="{% url 'events:event_detail' event.pk %}">{{ event.title }}</a>
      </h2>
      
      <div class="event-meta-item">
        <svg class="event-meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>{{ event.start_datetime|date:"D, d M Y, H:i" }}</span>
      </div>

      <div class="event-meta-item">
        <svg class="event-meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span>{{ event.venue }}</span>
      </div>

      <div class="event-meta-item mb-3">
        <svg class="event-meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Hosted by {{ event.organizer.get_full_name }}</span>
      </div>

      <div class="event-card-footer">
        {% include "events/_availability_badge.html" %}
        <span class="view-details-arrow">
          <span>View details</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </span>
      </div>
    </div>
  </div>
</div>
