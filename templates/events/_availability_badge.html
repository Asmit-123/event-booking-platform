{% if event.is_cancelled %}
  <span class="badge text-bg-secondary"><span class="badge-dot" aria-hidden="true"></span>Cancelled</span>
{% elif event.is_past %}
  <span class="badge text-bg-dark"><span class="badge-dot" aria-hidden="true"></span>Ended</span>
{% elif event.seats_left <= 0 %}
  <span class="badge text-bg-danger"><span class="badge-dot" aria-hidden="true"></span>Sold out</span>
{% elif event.seats_left <= 3 %}
  <span class="badge text-bg-warning"><span class="badge-dot" aria-hidden="true"></span>{{ event.seats_left }} seat{{ event.seats_left|pluralize }} left</span>
{% else %}
  <span class="badge text-bg-success"><span class="badge-dot" aria-hidden="true"></span>{{ event.seats_left }} seat{{ event.seats_left|pluralize }} left</span>
{% endif %}
