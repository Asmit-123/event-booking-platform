<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Event Booking{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'events:home' %}">Event Booking</a>
      <div class="ms-auto text-white">
        {% if user.is_authenticated %}
          <span>{{ user.get_full_name }} ({{ user.get_role_display }})</span>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:signup' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">
        {{ message }}
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
