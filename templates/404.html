{% extends "base.html" %}

{% block title %}Page not found | Event Booking{% endblock %}

{% block content %}
  <div class="empty-state-box my-5">
    <div class="empty-state-icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <h1 class="display-6 fw-bold mb-2">Page not found</h1>
    <p class="text-muted fs-5 mb-4">The page you are looking for does not exist or has moved.</p>
    <div class="d-flex gap-2 justify-content-center">
      <a class="btn btn-primary" href="{% url 'events:event_list' %}">Browse events</a>
      <a class="btn btn-outline-secondary" href="{% url 'events:home' %}">Home</a>
    </div>
  </div>
{% endblock %}
