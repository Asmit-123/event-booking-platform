{% extends "base.html" %}

{% block title %}Sign up | Event Booking{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-9 col-lg-7">
    <div class="card shadow-lg">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="19" y1="8" x2="19" y2="14"></line>
              <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
          </div>
          <h1 class="h3 fw-bold mb-1">Create your account</h1>
          <p class="text-muted small mb-0">Join organizers and attendees on Event Booking</p>
        </div>

        <form method="post" novalidate data-prevent-double-submit>
          {% csrf_token %}
          {% include "includes/form_body.html" %}
          <button type="submit" class="btn btn-primary btn-lg w-100 mt-3" data-loading-text="Creating account...">Sign up</button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          Already have an account? <a class="fw-semibold" href="{% url 'accounts:login' %}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
