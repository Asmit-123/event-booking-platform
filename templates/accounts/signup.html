{% extends "base.html" %}

{% block title %}Sign up | Event Booking{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Create your account</h1>

        <form method="post" novalidate data-prevent-double-submit>
          {% csrf_token %}
          {% include "includes/form_body.html" %}
          <button type="submit" class="btn btn-primary w-100" data-loading-text="Creating account...">Sign up</button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
          Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
