{% extends "base.html" %}

{% block title %}Log in | Event Booking{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Log in</h1>

        <form method="post" novalidate data-prevent-double-submit>
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          {% include "includes/form_body.html" %}
          <button type="submit" class="btn btn-primary w-100" data-loading-text="Logging in...">Log in</button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
          No account yet? <a href="{% url 'accounts:signup' %}">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
